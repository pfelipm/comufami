<script>
/**
 * Lógica de cliente para la Web App ComuFami.
 */

// Estado global de la aplicación
const state = {
    user: null,
    view: 'loading',
    grupos: [],
    allEstudiantes: [], // Lista completa para administración
    allUsuarios: [], // Lista completa para administración
    estudiantes: [], // Cache de estudiantes del docente (reducida)
    allRecords: [], // Cache de todos los registros (para Dashboard Global)
    recordsFamilia: [], // Cache de registros para el portal de familia
    currentRecord: null, // Temporal para previsualización
    appName: '',
    accentColor: '',
    logoUrl: '',
    footerLogoUrl: '',
    appFooterLogoLinkUrl: '',
    footerText: '',
    token: null, // Token de acceso familia
    pin: null, // PIN del progenitor actual
    parentIndex: null, // 1 o 2 (según el PIN introducido)
    quill: null, // Instancia del editor enriquecido
    isEdit: false, // Indica si el modal actual es de edición
    eSortAsc: true,
    uSortAsc: true,
    sortAsc: false, // Para el portal de familia
    dashboardChart: null, // Instancia ApexCharts (Familias)
    dashboardChartGlobal: null, // Instancia ApexCharts (Staff)
    dashboardChartType: 'bar' // 'bar' para columnas apiladas, 'line' para líneas
};

/**
 * Muestra u oculta el spinner de carga global.
 */
function toggleLoader(show) {
    const loader = document.getElementById('global-loader');
    if (loader) {
        if (show) loader.classList.remove('hidden');
        else loader.classList.add('hidden');
    }
}

/**
 * Muestra un modal de alerta (estilo alert).
 */
function showAlert(title, message, type = 'info') {
    const modal = document.getElementById('modal-dialog');
    const titleEl = document.getElementById('dialog-title');
    const msgEl = document.getElementById('dialog-message');
    const iconEl = document.getElementById('dialog-icon');
    const iconContainer = document.getElementById('dialog-icon-container');
    const btnCancel = document.getElementById('dialog-cancel');
    const btnOk = document.getElementById('dialog-ok');

    titleEl.innerText = title;
    msgEl.innerText = message;
    btnCancel.classList.add('hidden');
    
    // Configurar icono y colores según tipo
    iconContainer.className = 'rounded-full p-2 ';
    btnOk.className = 'px-6 py-2 text-sm font-bold text-white rounded-md shadow-sm transition-all ';
    
    if (type === 'error') {
        iconContainer.classList.add('bg-red-100', 'text-red-600');
        iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>';
        btnOk.classList.add('bg-red-600', 'hover:bg-red-700');
    } else if (type === 'success') {
        iconContainer.classList.add('bg-green-100', 'text-green-600');
        iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
        btnOk.classList.add('bg-accent', 'hover:brightness-110');
    } else {
        iconContainer.classList.add('bg-accent', 'bg-opacity-10', 'text-accent');
        iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
        btnOk.classList.add('bg-accent', 'hover:brightness-110');
    }

    btnOk.onclick = () => { modal.classList.add('hidden'); };
    modal.classList.remove('hidden');
}

/**
 * Muestra un modal de confirmación (estilo confirm).
 */
function showConfirm(title, message, callback, type = 'warning') {
    const modal = document.getElementById('modal-dialog');
    const titleEl = document.getElementById('dialog-title');
    const msgEl = document.getElementById('dialog-message');
    const iconEl = document.getElementById('dialog-icon');
    const iconContainer = document.getElementById('dialog-icon-container');
    const btnCancel = document.getElementById('dialog-cancel');
    const btnOk = document.getElementById('dialog-ok');

    titleEl.innerText = title;
    msgEl.innerText = message;
    btnCancel.classList.remove('hidden');
    
    iconContainer.className = 'rounded-full p-2 bg-orange-100 text-orange-600';
    iconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>';
    btnOk.className = 'px-6 py-2 text-sm font-bold text-white bg-accent hover:brightness-110 rounded-md shadow-sm transition-all';

    btnOk.onclick = () => { modal.classList.add('hidden'); if (callback) callback(); };
    btnCancel.onclick = () => { modal.classList.add('hidden'); };
    modal.classList.remove('hidden');
}

/**
 * Gestiona el estado de carga de un botón.
 */
function setButtonState(btnId, isLoading, normalText) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    
    if (isLoading) {
        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed', 'flex', 'items-center', 'justify-center', 'gap-2');
        btn.style.minWidth = btn.offsetWidth + 'px'; // Mantener el ancho original
        btn.innerHTML = `
            <svg class="animate-spin h-4 w-4 text-white flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="whitespace-nowrap">Procesando...</span>
        `;
    } else {
        btn.disabled = false;
        btn.classList.remove('opacity-70', 'cursor-not-allowed', 'flex', 'items-center', 'justify-center', 'gap-2');
        btn.style.minWidth = '';
        btn.innerHTML = `<span>${normalText}</span>`;
    }
}

// Inicialización al cargar el DOM
document.addEventListener('DOMContentLoaded', () => {
    inicializarApp();
});

/**
 * Carga inicial de datos del usuario y configuración.
 */
function inicializarApp() {
    console.log('Iniciando cliente...');
    state.token = window.URL_TOKEN; // Capturamos el token de index.html

    google.script.run
        .withSuccessHandler(response => {
            if (response.success) {
                state.appName = response.appName;
                state.accentColor = response.accentColor;
                state.logoUrl = response.logoUrl;
                state.footerLogoUrl = response.footerLogoUrl;
                state.appFooterLogoLinkUrl = response.appFooterLogoLinkUrl;
                state.footerText = response.footerText;

                // Aplicar personalización visual dinámica
                document.documentElement.style.setProperty('--accent-color', state.accentColor);

                if (state.footerLogoUrl) {
                    let logoHtml = `<img src="${state.footerLogoUrl}" alt="Logo Footer" class="h-12 w-auto grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all">`;
                    if (state.appFooterLogoLinkUrl) {
                        logoHtml = `<a href="${state.appFooterLogoLinkUrl}" target="_blank" class="block">${logoHtml}</a>`;
                    }
                    document.getElementById('footer-logo-container').innerHTML = logoHtml;
                }
                const footerTextEl = document.getElementById('footer-custom-text');
                if (footerTextEl) {
                    footerTextEl.innerText = state.footerText || `© ${new Date().getFullYear()} ${state.appName}`;
                }
                
                document.getElementById('main-footer').classList.remove('hidden');

                // LÓGICA DE ENRUTAMIENTO INICIAL
                if (response.tipo === 'MANTENIMIENTO') {
                    renderMantenimiento(response.urlApp);
                } else if (state.token) {
                    // Si viene por token, ignoramos login de dominio y vamos al login por PIN
                    renderLoginFamiliaToken();
                } else if (response.tipo === 'PERSONAL') {
                    state.user = response.data;
                    document.getElementById('user-info').innerText = `${state.user.nombre} (${state.user.rol})`;
                    document.getElementById('user-info').classList.remove('hidden');
                    actualizarCacheGrupos(() => navegar('inicio'));
                } else {
                    // Es un usuario externo (Familia) sin token
                    state.user = response.data;
                    if (state.user.nombre !== 'Usuario Externo') {
                        document.getElementById('user-info').innerText = `${state.user.nombre} (Familia)`;
                        document.getElementById('user-info').classList.remove('hidden');
                        navegar('dashboard-familia');
                    } else {
                        navegar('login-familia');
                    }
                }
            } else {
                mostrarError('Error al cargar la aplicación: ' + response.error);
            }
        })
        .withFailureHandler(err => {
            console.error('Error al inicializar:', err);
            mostrarError('Error de conexión con el servidor.');
        })
        .obtenerDatosIniciales();
}

/**
 * Actualiza la caché de grupos local.
 */
function actualizarCacheGrupos(callback) {
    google.script.run.withSuccessHandler(response => {
        if (response.success) {
            state.grupos = response.data;
            if (callback) callback();
        }
    }).listarGrupos();
}

/**
 * Gestión de la navegación SPA.
 */
function navegar(vista) {
    console.log('Navegando a:', vista);
    state.view = vista;
    const appContainer = document.getElementById('app');
    
    // Limpiar instancias de gráficos para evitar errores de renderizado en DOM inexistente
    if (state.dashboardChart) { state.dashboardChart.destroy(); state.dashboardChart = null; }
    if (state.dashboardChartGlobal) { state.dashboardChartGlobal.destroy(); state.dashboardChartGlobal = null; }

    switch(vista) {
        case 'inicio':
            renderInicio(appContainer);
            break;
        case 'usuarios':
            renderUsuarios(appContainer);
            break;
        case 'estudiantes':
            renderEstudiantes(appContainer);
            break;
        case 'grupos':
            renderGrupos(appContainer);
            break;
        case 'crear-registro':
            renderCrearRegistro(appContainer);
            break;
        case 'dashboard':
            renderDashboardGlobal(appContainer);
            break;
        case 'ajustes':
            renderAjustes(appContainer);
            break;
        case 'login-familia':
            renderLoginFamiliaManual(appContainer);
            break;
        case 'dashboard-familia':
        case 'dashboard-familia-general':
            renderDashboardFamiliaGeneral(appContainer);
            break;
        default:
            console.error('Vista no reconocida:', vista);
            appContainer.innerHTML = `<p class="text-center text-red-500">Vista no encontrada: ${vista}</p>`;
    }
}

function cargarEstudiantesDocente() {
    toggleLoader(true);
    google.script.run.withSuccessHandler(response => {
        toggleLoader(false);
        if (response.success) {
            state.estudiantes = response.data;
            
            // Poblamos los grupos únicos que tiene el docente
            const gruposSet = new Set(state.estudiantes.map(e => e.grupo));
            const selectGrupo = document.getElementById('reg-grupo');
            
            // Limpiar antes de añadir
            selectGrupo.innerHTML = '<option value="">Seleccione grupo...</option>';
            Array.from(gruposSet).sort().forEach(g => {
                selectGrupo.innerHTML += `<option value="${g}">${g}</option>`;
            });
        } else {
            showAlert('Error', response.error, 'error');
        }
    }).obtenerEstudiantesDocente();
}

function filtrarEstudiantesPorGrupo(grupo) {
    const selectEst = document.getElementById('reg-estudiante');
    selectEst.innerHTML = '<option value="">Seleccione estudiante...</option>';
    
    if (!grupo) return;
    
    const filtrados = state.estudiantes.filter(e => e.grupo === grupo);
    filtrados.forEach(e => {
        selectEst.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
    });
}

function irAPaso2() {
    const idEst = document.getElementById('reg-estudiante').value;
    const est = state.estudiantes.find(e => e.id.toString() === idEst.toString());
    
    toggleLoader(true);
    const datos = {
        id_estudiante: idEst,
        tipo: document.getElementById('reg-tipo').value,
        descripcion: document.getElementById('reg-descripcion').value
    };
    
    state.currentRecord = datos;

    google.script.run.withSuccessHandler(response => {
        toggleLoader(false);
        if (response.success) {
            document.getElementById('notif-asunto').value = response.data.asunto;
            document.getElementById('preview-destinatarios').innerText = response.data.destinatarios;
            document.getElementById('preview-replyto').innerText = state.user.email;
            
            // Lógica mejora CCO Progenitores Independientes
            const ccoCheckbox = document.getElementById('notif-cco');
            if (est && est.independientes) {
                ccoCheckbox.checked = true;
                ccoCheckbox.disabled = true;
                ccoCheckbox.parentElement.classList.add('opacity-60');
                ccoCheckbox.parentElement.title = 'Obligatorio para progenitores independientes';
            } else {
                ccoCheckbox.checked = true; // Por defecto activado
                ccoCheckbox.disabled = false;
                ccoCheckbox.parentElement.classList.remove('opacity-60');
                ccoCheckbox.parentElement.title = '';
            }

            document.getElementById('paso-1').classList.add('hidden');
            document.getElementById('paso-2').classList.remove('hidden');
            window.scrollTo(0, 0);

            // Inicializar o actualizar Quill
            if (!state.quill) {
                state.quill = new Quill('#notif-editor', {
                    theme: 'snow',
                    modules: {
                        toolbar: [
                            ['bold', 'italic', 'underline'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            [{ 'color': [] }, { 'background': [] }],
                            ['clean']
                        ]
                    }
                });
            }
            state.quill.root.innerHTML = response.data.cuerpo;
        } else {
            showAlert('Error', response.error, 'error');
        }
    }).generarPrevisualizacionNotificacion(datos);
}

function volverAPaso1() {
    document.getElementById('paso-2').classList.add('hidden');
    document.getElementById('paso-1').classList.remove('hidden');
}

function enviarRegistroFinal() {
    showConfirm('Confirmar envío', '¿Confirmas que deseas enviar esta notificación a la familia?', () => {
        toggleLoader(true);
        const finalData = {
            ...state.currentRecord,
            notificacion_asunto: document.getElementById('notif-asunto').value,
            notificacion_cuerpo: state.quill.root.innerHTML,
            notificacion_cco: document.getElementById('notif-cco').checked,
            notificacion_copia: document.getElementById('notif-copia').checked
        };

        google.script.run.withSuccessHandler(response => {
            toggleLoader(false);
            if (response.success) {
                document.getElementById('paso-2').classList.add('hidden');
                document.getElementById('paso-exito').classList.remove('hidden');
            } else {
                showAlert('Error', response.error, 'error');
            }
        }).guardarRegistroYNotificar(finalData);
    });
}

/**
 * FAMILIAS
 */
function renderLoginFamilia(container) {
    container.innerHTML = `
        <div class="fade-in max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Acceso familias</h2>
            <form onsubmit="event.preventDefault(); intentarLoginFamilia();">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                    <input type="email" id="f-email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700">PIN de acceso</label>
                    <input type="password" id="f-pin" required maxlength="6" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-center text-2xl tracking-widest">
                </div>
                <button type="submit" class="w-full bg-accent text-white px-4 py-2 rounded-md hover:brightness-110 transition-colors font-bold">Entrar</button>

                <p id="login-error" class="mt-4 text-sm text-red-600 hidden text-center"></p>
            </form>
        </div>
    `;
}

function intentarLoginFamilia() {
    toggleLoader(true);
    const email = document.getElementById('f-email').value;
    const pin = document.getElementById('f-pin').value;
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden');
    
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.tipo === 'MANTENIMIENTO') {
                renderMantenimiento();
                return;
            }
            if (response && response.success) {
                state.user = response.data;
                document.getElementById('user-info').innerText = `${state.user.nombre} (Familia)`;
                document.getElementById('user-info').classList.remove('hidden');
                navegar('dashboard-familia');
            } else {
                errorEl.innerText = response.error;
                errorEl.classList.remove('hidden');
            }
        })
        .withFailureHandler(err => { toggleLoader(false); errorEl.innerText = 'Error: ' + err; errorEl.classList.remove('hidden'); })
        .loginFamilia(email, pin);
}

/**
 * ESTUDIANTES
 */
function renderEstudiantes(container) {
    container.innerHTML = `
        <div class="fade-in">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">

function cargarEstudiantes() {
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.success) {
                state.allEstudiantes = response.data;
                
                // Poblar filtro de grupos
                const grupos = [...new Set(state.allEstudiantes.map(e => e.grupo))].sort();
                const selectGr = document.getElementById('e-filtro-grupo');
                if (selectGr) {
                    selectGr.innerHTML = '<option value="">Todos los grupos</option>';
                    grupos.forEach(g => {
                        selectGr.innerHTML += `<option value="${g}">${g}</option>`;
                    });
                }

                state.eSortAsc = true;
                filtrarYMostrarEstudiantes();
            } else {
                showAlert('Error', 'No se pudieron cargar los estudiantes: ' + (response ? response.error : 'Sin respuesta del servidor'), 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Fallo al comunicar con el servidor: ' + err.message, 'error');
        })
        .listarEstudiantes();
}

function filtrarYMostrarEstudiantes() {
    const texto = document.getElementById('e-filtro-texto').value.toLowerCase();
    const grupo = document.getElementById('e-filtro-grupo').value;
    
    let filtrados = state.allEstudiantes.filter(e => {
        const matchesTexto = e.nombre.toLowerCase().includes(texto) || 
                             e.id.toString().toLowerCase().includes(texto) ||
                             e.p1_email.toLowerCase().includes(texto) ||
                             (e.p2_email && e.p2_email.toLowerCase().includes(texto));
        const matchesGrupo = !grupo || e.grupo === grupo;
        return matchesTexto && matchesGrupo;
    });

    // Ordenar por nombre (por defecto)
    filtrados.sort((a, b) => {
        const nomA = a.nombre.toLowerCase();
        const nomB = b.nombre.toLowerCase();
        if (nomA < nomB) return state.eSortAsc ? -1 : 1;
        if (nomA > nomB) return state.eSortAsc ? 1 : -1;
        return 0;
    });

    const lista = document.getElementById('estudiantes-lista');
    if (filtrados.length === 0) {
        lista.innerHTML = '<div class="p-12 text-center text-gray-400 italic">No se han encontrado estudiantes con los filtros aplicados.</div>';
        return;
    }

    let html = `<table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase text-center tracking-wider">NIA</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Alumno</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Grupo</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Progenitores</th>
                ${state.user.rol !== 'Supervisor' ? '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>' : ''}
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">`;

    filtrados.forEach(e => {
        html += `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4 text-sm font-mono text-gray-600 text-center">${e.id}</td>
                <td class="px-6 py-4 text-sm font-bold text-gray-900">${e.nombre}</td>
                <td class="px-6 py-4 text-sm text-gray-600">
                    <span class="px-2 py-1 bg-gray-100 rounded text-xs font-medium">${e.grupo}</span>
                </td>
                <td class="px-6 py-4 text-xs text-gray-600">
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-1">
                            <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span>${e.p1_nombre} <span class="text-gray-400">(${e.p1_email})</span></span>
                        </div>
                        ${e.p2_email ? `
                        <div class="flex items-center gap-1">
                            <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span>${e.p2_nombre} <span class="text-gray-400">(${e.p2_email})</span></span>
                        </div>` : ''}
                    </div>
                </td>
                ${state.user.rol !== 'Supervisor' ? `
                <td class="px-6 py-4 text-sm flex gap-3">
                    <button onclick='editarEstudiante(${JSON.stringify(e)})' class="text-accent hover:underline font-bold">Editar</button>
                    <button onclick='eliminarEstudianteFront("${e.id}", "${e.nombre}")' class="text-red-600 hover:underline font-bold">Borrar</button>
                </td>` : ''}
            </tr>`;
    });

    html += '</tbody></table>';
    lista.innerHTML = html;
}

function toggleSortEstudiantes() {
    state.eSortAsc = !state.eSortAsc;
    const label = document.getElementById('e-sort-label');
    const icon = document.getElementById('e-sort-icon');
    
    label.innerText = state.eSortAsc ? 'Nombre (A-Z)' : 'Nombre (Z-A)';
    icon.style.transform = state.eSortAsc ? 'rotate(0deg)' : 'rotate(180deg)';
    
    filtrarYMostrarEstudiantes();
}

function limpiarFiltroEstudiantes() {
    const input = document.getElementById('e-filtro-texto');
    if (input) {
        input.value = '';
        filtrarYMostrarEstudiantes();
    }
}

function generarPinAleatorio(elementId) {
    const pin = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById(elementId).value = pin;
    return pin;
}

function validarFormatoPin(inputEl) {
    if (!inputEl || !inputEl.value) return true;
    const isValid = /^[0-9]{6}$/.test(inputEl.value);
    if (!isValid) {
        inputEl.classList.add('border-red-500');
        inputEl.classList.remove('border-gray-300');
    } else {
        inputEl.classList.remove('border-red-500');
        inputEl.classList.add('border-gray-300');
    }
    return isValid;
}

function mostrarFormularioEstudiante() {
    toggleLoader(true);
    state.isEdit = false;
    actualizarCacheGrupos(() => {
        document.getElementById('modal-e-titulo').innerText = 'Nuevo estudiante';
        document.getElementById('e-id').disabled = false;
        document.getElementById('e-id').value = '';
        document.getElementById('e-nombre').value = '';
        document.getElementById('e-independientes').checked = false;
        document.getElementById('e-p1-nombre').value = '';
        document.getElementById('e-p1-email').value = '';
        document.getElementById('e-p1-pin').value = '';
        document.getElementById('e-p2-nombre').value = '';
        document.getElementById('e-p2-email').value = '';
        document.getElementById('e-p2-pin').value = '';
        
        // Auto-generar PINs iniciales garantizando que sean distintos
        const pin1 = generarPinAleatorio('e-p1-pin');
        let pin2;
        do {
            pin2 = generarPinAleatorio('e-p2-pin');
        } while (pin1 === pin2);
        
        const select = document.getElementById('e-grupo');
        select.innerHTML = '<option value="">Selecciona un grupo...</option>';
        state.grupos.forEach(g => {
            select.innerHTML += `<option value="${g.codigo}">${g.codigo} - ${g.nombre}</option>`;
        });
        
        document.getElementById('modal-estudiante').classList.remove('hidden');
        toggleLoader(false);
    });
}

function editarEstudiante(e) {
    toggleLoader(true);
    state.isEdit = true;
    actualizarCacheGrupos(() => {
        document.getElementById('modal-e-titulo').innerText = 'Editar estudiante';
        document.getElementById('e-id').value = e.id;
        document.getElementById('e-id').disabled = true;
        document.getElementById('e-nombre').value = e.nombre;
        document.getElementById('e-independientes').checked = e.independientes || false;
        document.getElementById('e-p1-nombre').value = e.p1_nombre;
        document.getElementById('e-p1-email').value = e.p1_email;
        document.getElementById('e-p1-pin').value = e.p1_pin || '';
        document.getElementById('e-p2-nombre').value = e.p2_nombre || '';
        document.getElementById('e-p2-email').value = e.p2_email || '';
        document.getElementById('e-p2-pin').value = e.p2_pin || '';
        
        const select = document.getElementById('e-grupo');
        select.innerHTML = '<option value="">Selecciona un grupo...</option>';
        state.grupos.forEach(g => {
            const selected = (g.codigo === e.grupo) ? 'selected' : '';
            select.innerHTML += `<option value="${g.codigo}" ${selected}>${g.codigo} - ${g.nombre}</option>`;
        });
        
        document.getElementById('modal-estudiante').classList.remove('hidden');
        toggleLoader(false);
    });
}

function guardarEstudianteFront() {
    const p1PinEl = document.getElementById('e-p1-pin');
    const p2PinEl = document.getElementById('e-p2-pin');
    const p1Pin = p1PinEl.value;
    const p2Pin = p2PinEl.value;
    const p2Email = document.getElementById('e-p2-email').value;

    if (!validarFormatoPin(p1PinEl)) {
        showAlert('Error de formato', 'El PIN del Progenitor 1 debe contener exactamente 6 números.', 'error');
        return;
    }

    if (p2Email && !validarFormatoPin(p2PinEl)) {
        showAlert('Error de formato', 'El PIN del Progenitor 2 debe contener exactamente 6 números.', 'error');
        return;
    }

    if (p2Email && p2Pin && p1Pin === p2Pin) {
        showAlert('Error', 'Los PINs de ambos progenitores no pueden ser idénticos.', 'error');
        return;
    }

    if (p2Email && !p2Pin) {
        showAlert('Error', 'Si se proporciona un segundo progenitor, debe tener un PIN válido de 6 dígitos.', 'error');
        return;
    }

    toggleLoader(true);
    const estudiante = {
        id: document.getElementById('e-id').value,
        nombre: document.getElementById('e-nombre').value,
        grupo: document.getElementById('e-grupo').value,
        independientes: document.getElementById('e-independientes').checked,
        p1_nombre: document.getElementById('e-p1-nombre').value,
        p1_email: document.getElementById('e-p1-email').value,
        p1_pin: p1Pin,
        p2_nombre: document.getElementById('e-p2-nombre').value,
        p2_email: p2Email,
        p2_pin: p2Pin
    };
    google.script.run.withSuccessHandler(response => {
        toggleLoader(false);
        if (response && response.success) { cerrarModalEstudiante(); cargarEstudiantes(); }
        else showAlert('Error', (response ? response.error : 'Sin respuesta del servidor'), 'error');
    }).withFailureHandler(err => { toggleLoader(false); showAlert('Error', 'Error de conexión: ' + err.message, 'error'); }).guardarEstudiante(estudiante, !state.isEdit);
}

function eliminarEstudianteFront(id, nombre) {
    showConfirm('Confirmar borrado', `¿Seguro que deseas eliminar al estudiante ${nombre}? Esta acción no se puede deshacer.`, () => {
        toggleLoader(true);
        google.script.run.withSuccessHandler(response => {
            toggleLoader(false);
            if (response.success) {
                showAlert('Éxito', 'Estudiante eliminado correctamente.', 'success');
                cargarEstudiantes();
            } else {
                showAlert('No se pudo eliminar', response.error, 'error');
            }
        }).withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Error de conexión: ' + err.message, 'error');
        }).eliminarEstudiante(id);
    });
}

function cerrarModalEstudiante() { document.getElementById('modal-estudiante').classList.add('hidden'); }

function cargarGrupos() {
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.success) {
                const grupos = response.data;
                const lista = document.getElementById('grupos-lista');
                if (grupos.length === 0) { lista.innerHTML = '<div class="p-10 text-center text-gray-500">No hay grupos registrados.</div>'; return; }

                grupos.forEach(g => {
                    html += `<tr><td class="px-6 py-4 text-sm font-bold text-gray-900">${g.codigo}</td><td class="px-6 py-4 text-sm text-gray-600">${g.nombre}</td><td class="px-6 py-4 text-sm flex gap-3"><button onclick='editarGrupo(${JSON.stringify(g)})' class="text-accent hover:underline font-bold">Editar</button> <button onclick="eliminarGrupo('${g.codigo}')" class="text-red-600 hover:underline font-bold">Borrar</button></td></tr>`;
                });

                lista.innerHTML = html;
            } else {
                showAlert('Error', 'No se pudieron cargar los grupos: ' + (response ? response.error : 'Sin respuesta del servidor'), 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Fallo al comunicar con el servidor: ' + err.message, 'error');
        })
        .listarGrupos();
}

function cargarUsuarios() {
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.success) {
                state.allUsuarios = response.data;
                state.uSortAsc = true;
                filtrarYMostrarUsuarios();
            } else {
                showAlert('Error', 'No se pudieron cargar los usuarios: ' + (response ? response.error : 'Sin respuesta del servidor'), 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Fallo al comunicar con el servidor: ' + err.message, 'error');
        })
        .listarUsuarios();
}

function filtrarYMostrarUsuarios() {
    const texto = document.getElementById('u-filtro-texto').value.toLowerCase();
    const rol = document.getElementById('u-filtro-rol').value;
    const estado = document.getElementById('u-filtro-estado').value;
    
    let filtrados = state.allUsuarios.filter(u => {
        const matchesTexto = u.nombre.toLowerCase().includes(texto) || u.email.toLowerCase().includes(texto);
        const matchesRol = !rol || u.rol === rol;
        const matchesEstado = !estado || u.estado === estado;
        return matchesTexto && matchesRol && matchesEstado;
    });

    // Ordenar por nombre
    filtrados.sort((a, b) => {
        const nomA = a.nombre.toLowerCase();
        const nomB = b.nombre.toLowerCase();
        if (nomA < nomB) return state.uSortAsc ? -1 : 1;
        if (nomA > nomB) return state.uSortAsc ? 1 : -1;
        return 0;
    });

    const lista = document.getElementById('usuarios-lista');
    if (filtrados.length === 0) {
        lista.innerHTML = '<div class="p-12 text-center text-gray-400 italic">No se han encontrado usuarios con los filtros aplicados.</div>';
        return;
    }

    let html = `
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase text-center tracking-wider">Rol</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase text-center tracking-wider">Grupos</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">`;

    usuarios = filtrados; // Para consistencia con el bucle original si fuera necesario
    filtrados.forEach(u => {
        const rolColor = u.rol === 'Administrador' ? 'bg-purple-100 text-purple-800' : 
                         u.rol === 'Supervisor' ? 'bg-indigo-100 text-indigo-800' : 
                         'bg-blue-100 text-blue-800';
        
        html += `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4 text-sm text-gray-600">${u.email}</td>
                <td class="px-6 py-4 text-sm font-bold text-gray-900">${u.nombre}</td>
                <td class="px-6 py-4 text-sm text-center">
                    <span class="px-2 py-1 text-[10px] font-bold uppercase rounded-full ${rolColor}">${u.rol}</span>
                </td>
                <td class="px-6 py-4 text-sm text-center font-mono text-gray-400 text-xs">${u.grupos || '-'}</td>
                <td class="px-6 py-4 text-sm flex gap-3">
                    <button onclick='editarUsuario(${JSON.stringify(u)})' class="text-accent hover:underline font-bold">Editar</button>
                    ${state.user.rol === 'Administrador' && u.email.toLowerCase() !== state.user.email.toLowerCase() ? `
                        <button onclick='eliminarUsuarioFront("${u.email}")' class="text-red-600 hover:underline font-bold">Borrar</button>
                    ` : ''}
                </td>
            </tr>`;
    });

    html += '</tbody></table>';
    lista.innerHTML = html;
}

function guardarUsuario() {
    toggleLoader(true);
    const checkboxes = document.querySelectorAll('.grupo-checkbox:checked');
    const grupos = Array.from(checkboxes).map(cb => cb.value).join(', ');
    
    const usuario = {
        email: document.getElementById('u-email').value,
        nombre: document.getElementById('u-nombre').value,
        rol: document.getElementById('u-rol').value,
        estado: document.getElementById('u-estado').value,
        grupos: grupos
    };
    google.script.run.withSuccessHandler(response => {
        toggleLoader(false);
        if (response.success) { cerrarModal(); cargarUsuarios(); }
        else showAlert('Error', response.error, 'error');
    }).withFailureHandler(err => { toggleLoader(false); showAlert('Error', 'Error de conexión: ' + err.message, 'error'); }).guardarUsuario(usuario, !state.isEdit);
}

function eliminarUsuarioFront(email) {
    if (email.toLowerCase() === state.user.email.toLowerCase()) {
        showAlert('Acción no permitida', 'No puedes eliminar tu propia cuenta de usuario.', 'error');
        return;
    }

    showConfirm('Confirmar borrado', `¿Seguro que deseas eliminar al usuario ${email}? Esta acción no se puede deshacer.`, () => {
        toggleLoader(true);
        google.script.run.withSuccessHandler(response => {
            toggleLoader(false);
            if (response.success) {
                showAlert('Éxito', 'Usuario eliminado correctamente.', 'success');

            } else {
                showAlert('No se pudo eliminar', response.error, 'error');
            }
        }).withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Error de conexión: ' + err.message, 'error');
        }).eliminarUsuario(email);

function cargarAjustes() {
    google.script.run.withSuccessHandler(response => {
        const lista = document.getElementById('ajustes-lista');
        if (response.success) {
            // Orden específico solicitado por el usuario
            const ordenDeseado = [
                'DEBUG_USER',
                'APP_WEBAPP_URL',
                'MAINTENANCE_MODE',
                'APP_NAME',
                'APP_ACCENT_COLOR',
                'APP_LOGO_URL',
                'APP_FOOTER_LOGO_URL',
                'APP_FOOTER_LOGO_LINK_URL',
                'APP_FOOTER_TEXT',
                'HIDE_DETAILS_IN_EMAIL'
            ];

            const ajustes = response.data;
            // Ordenar los ajustes según el array de ordenDeseado
            ajustes.sort((a, b) => {
                let indexA = ordenDeseado.indexOf(a.parametro);
                let indexB = ordenDeseado.indexOf(b.parametro);
                if (indexA === -1) indexA = 99; // Parámetros nuevos al final
                if (indexB === -1) indexB = 99;
                return indexA - indexB;
            });

            let html = '';
            ajustes.forEach(a => {
                let inputHtml = '';
                if (a.parametro === 'APP_ACCENT_COLOR') {
                    const colores = ['#0C1A78', '#1d4ed8', '#7c3aed', '#db2777', '#dc2626', '#ea580c', '#f59e0b', '#059669', '#0891b2', '#475569'];
                    let swatches = '';
                    colores.forEach(c => {
                        swatches += `<div onclick="document.getElementById('adj-${a.parametro}').value='${c}'; document.getElementById('hex-${a.parametro}').innerText='${c}';" 
                                          class="w-5 h-5 rounded-sm cursor-pointer hover:scale-110 transition-transform shadow-sm border border-white" 
                                          style="background-color: ${c}" title="${c}"></div>`;
                    });

                    inputHtml = `
                        <div class="flex items-center gap-4 mt-1">
                            <div class="flex items-center gap-2">
                                <input type="color" id="adj-${a.parametro}" value="${a.valor}" 
                                       oninput="document.getElementById('hex-${a.parametro}').innerText = this.value"
                                       class="h-10 w-10 border border-gray-200 rounded-lg cursor-pointer bg-transparent shadow-sm hover:ring-2 hover:ring-accent transition-all">
                                <span id="hex-${a.parametro}" class="text-[10px] font-mono text-gray-400 font-bold uppercase tracking-wider w-16">${a.valor}</span>
                            </div>
                            <div class="grid grid-cols-5 gap-1 bg-gray-100 p-1 rounded border border-gray-200">
                                ${swatches}
                            </div>
                        </div>
                    `;
                } else if (a.parametro === 'MAINTENANCE_MODE' || a.parametro === 'HIDE_DETAILS_IN_EMAIL') {
                    const isChecked = a.valor.toString().toUpperCase() === 'TRUE';
                    // Para el fondo base (cuando NO está checked)
                    const baseBgClass = a.parametro === 'MAINTENANCE_MODE' ? 'bg-green-500' : 'bg-gray-300';
                    // Para el fondo cuando SÍ está checked
                    const checkedBgClass = a.parametro === 'MAINTENANCE_MODE' ? 'peer-checked:bg-orange-500' : 'peer-checked:bg-accent';
                    
                    inputHtml = `
                        <div class="mt-2">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="adj-${a.parametro}" class="sr-only peer" ${isChecked ? 'checked' : ''}
                                       onchange="document.getElementById('status-${a.parametro}').innerText = this.checked ? 'Activado' : 'Desactivado'">
                                <div class="w-11 h-6 ${baseBgClass} peer-focus:outline-none rounded-full peer ${checkedBgClass} peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                                <span class="ml-3 text-sm font-medium text-gray-600" id="status-${a.parametro}">${isChecked ? 'Activado' : 'Desactivado'}</span>
                            </label>
                        </div>
                    `;
                } else {
                    inputHtml = `
                        <input type="text" id="adj-${a.parametro}" value="${a.valor}" 
                               class="w-full border border-gray-200 rounded-md p-2 mt-1 text-sm focus:border-accent outline-none bg-transparent focus:bg-white transition-all">
                    `;
                }

                html += `
                    <div class="px-6 py-5 flex flex-col md:flex-row md:items-start gap-4 hover:bg-gray-50 transition-colors">
                        <div class="flex-grow">

            });
            lista.innerHTML = html || '<div class="p-10 text-center text-gray-500">No hay ajustes configurados.</div>';
        } else {
            lista.innerHTML = `<div class="p-10 text-center text-red-500 font-bold">${response.error}</div>`;
        }
    }).listarAjustes();
}

function guardarAjusteFront(parametro) {
    const input = document.getElementById(`adj-${parametro}`);
    let valor = input.value;

    // Manejo especial para interruptores booleanos
    if (parametro === 'MAINTENANCE_MODE' || parametro === 'HIDE_DETAILS_IN_EMAIL') {
        valor = input.checked ? 'TRUE' : 'FALSE';
    }

    showConfirm('Confirmar cambio', `¿Seguro que deseas actualizar el valor de ${parametro}?`, () => {
        toggleLoader(true);
        google.script.run.withSuccessHandler(response => {
            toggleLoader(false);
            if (response.success) {
                showAlert('Éxito', 'Ajuste actualizado correctamente.', 'success');
            } else {
                showAlert('Error', response.error, 'error');
            }
        }).withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Error de conexión: ' + err.message, 'error');
        }).guardarAjuste(parametro, valor);
    });
}

function renderInicio(container) {
    let html = `<div class="fade-in"><h1 class="text-2xl font-bold text-gray-800 mb-6">Bienvenido, ${state.user.nombre}</h1><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
    
    // 1. Registrar anotación (Admin y Docente)
    if (state.user.rol === 'Administrador' || state.user.rol === 'Docente') {
        html += crearTarjeta('Registrar anotación', 'Registra el seguimiento de un alumno.', 'accent', 'crear-registro');
    }
    
    // 2. Gestión de estudiantes (Admin, Docente, Supervisor)
    if (state.user.rol === 'Administrador' || state.user.rol === 'Docente' || state.user.rol === 'Supervisor') {
        html += crearTarjeta('Gestión de estudiantes', 'Consulta y administra el alumnado y sus familias.', 'green', 'estudiantes');
    }
    
    // 3. Dashboard global (Admin, Docente, Supervisor)
    if (state.user.rol === 'Administrador' || state.user.rol === 'Docente' || state.user.rol === 'Supervisor') {
        html += crearTarjeta('Dashboard global', 'Visualiza estadísticas y el historial completo.', 'indigo', 'dashboard');
    }
    
    // 4, 5, 6. Gestión de usuarios, grupos y configuración (Solo Admin)
    if (state.user.rol === 'Administrador') {
        html += crearTarjeta('Gestión de usuarios', 'Administra el profesorado y permisos.', 'gray', 'usuarios');
        html += crearTarjeta('Gestión de grupos', 'Define los grupos del centro.', 'accent', 'grupos');
        html += crearTarjeta('Configuración', 'Ajustes del sistema y mantenimiento.', 'orange', 'ajustes');
    }
    
    html += `</div></div>`;
    container.innerHTML = html;
}

function crearTarjeta(titulo, descripcion, color, accion) {
    const borderColor = color === 'accent' ? 'border-accent' : `border-${color}-600`;
    return `<div class="bg-white rounded-lg shadow-md p-6 border-l-4 ${borderColor} hover:shadow-lg transition-shadow cursor-pointer" onclick="navegar('${accion}')"><h3 class="text-lg font-semibold text-gray-900">${titulo}</h3><p class="text-gray-600 mt-2 text-sm">${descripcion}</p></div>`;
}

function mostrarError(mensaje) {

function verificarPinToken(event) {
    if (event) event.preventDefault();
    const pin = document.getElementById('fam-pin').value;
    
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (!response) {
                showAlert('Error', 'El servidor devolvió una respuesta vacía. Por favor, inténtelo de nuevo.', 'error');
                return;
            }
            if (response.success) {
                state.pin = pin;
                state.familyData = response.data;
                
                // Identificar al progenitor en la interfaz
                const est = response.data.estudiante;
                const pIdx = response.data.parentIndex;
                state.user = {
                    nombre: pIdx === 1 ? est.p1_nombre : est.p2_nombre,
                    email: pIdx === 1 ? est.p1_email : est.p2_email,
                    rol: 'Familia'
                };
                
                const userInfoEl = document.getElementById('user-info');
                if (userInfoEl) {
                    userInfoEl.innerText = `${state.user.nombre} (Familia)`;
                    userInfoEl.classList.remove('hidden');
                }

                renderDashboardFamilia(document.getElementById('app'), response.data);
            } else {
                showAlert('Acceso denegado', response.error, 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error de conexión', 'No se pudo contactar con el servidor: ' + err.message, 'error');
        })
        .validarTokenYPin(state.token, pin);
}

function enviarComentarioFamilia() {
    const comentario = document.getElementById('fam-nuevo-comentario').value;
    if (!comentario.trim()) {
        showAlert('Atención', 'El comentario no puede estar vacío.', 'warning');
        return;
    }

    setButtonState('btn-enviar-comentario-fam', true);
    google.script.run
        .withSuccessHandler(response => {
            setButtonState('btn-enviar-comentario-fam', false, 'Enviar respuesta');
            if (response.success) {
                showAlert('Éxito', 'Su respuesta ha sido registrada correctamente.', 'success');
                verificarPinToken();
            } else {
                showAlert('Error', 'No se pudo guardar el comentario: ' + response.error, 'error');
            }
        })
        .withFailureHandler(err => {
            setButtonState('btn-enviar-comentario-fam', false, 'Enviar respuesta');
            showAlert('Error', 'Fallo de conexión: ' + err.message, 'error');
        })
        .guardarComentarioFamilia(state.token, state.pin, comentario);
}

}

function toggleSortOrder() {
    state.sortAsc = !state.sortAsc;
    const label = document.getElementById('sort-label');
    const icon = document.getElementById('sort-icon');
    
    label.innerText = state.sortAsc ? 'Más antiguos' : 'Más recientes';
    icon.style.transform = state.sortAsc ? 'rotate(180deg)' : 'rotate(0deg)';
    
    filtrarYMostrarRegistrosFamilia();
}

function cargarRegistrosFamilia() {
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.success) {
                state.recordsFamilia = response.data;
                
                // Poblar filtro de alumnos
                const alumnos = [...new Set(state.recordsFamilia.map(r => r.estudiante_nombre))].sort();
                const selectAl = document.getElementById('filtro-alumno');
                if (selectAl) {
                    selectAl.innerHTML = '<option value="">Todos</option>';
                    alumnos.forEach(a => {
                        selectAl.innerHTML += `<option value="${a}">${a}</option>`;
                    });
                }

                filtrarYMostrarRegistrosFamilia();
            } else {
                showAlert('Error', 'No se pudieron cargar los registros: ' + (response ? response.error : 'Sin respuesta del servidor'), 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Fallo al comunicar con el servidor: ' + err.message, 'error');
        })
        .listarRegistrosFamilia(state.user.email, state.pin);
}

function filtrarYMostrarRegistrosFamilia() {
    const textoInput = document.getElementById('filtro-texto');
    const texto = textoInput ? textoInput.value.toLowerCase() : '';
    const alumno = document.getElementById('filtro-alumno').value;
    const tipo = document.getElementById('filtro-tipo').value;
    
    let filtrados = state.recordsFamilia.filter(r => {
        const matchesTexto = r.descripcion.toLowerCase().includes(texto) || r.tipo.toLowerCase().includes(texto);
        const matchesAlumno = !alumno || r.estudiante_nombre === alumno;
        const matchesTipo = !tipo || r.tipo === tipo;
        return matchesTexto && matchesAlumno && matchesTipo;
    });

    // Ordenar
    filtrados.sort((a, b) => {
        const dA = new Date(a.fecha).getTime();
        const dB = new Date(b.fecha).getTime();
        return state.sortAsc ? dA - dB : dB - dA;
    });

    const container = document.getElementById('registros-familia-lista');
    
    // Actualizar gráfico si el dashboard está visible
    const dashContainer = document.getElementById('dashboard-container');
    if (dashContainer && !dashContainer.classList.contains('hidden')) {
        renderizarOActualizarGrafico(filtrados);
    }

    if (filtrados.length === 0) {
        container.innerHTML = '<div class="p-12 text-center text-gray-400 italic">No se han encontrado registros con los filtros aplicados.</div>';
        return;
    }

    container.innerHTML = '';
    filtrados.forEach(reg => {
        const fecha = new Date(reg.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        let badgeColor = 'bg-blue-100 text-blue-700';
        if (reg.tipo === 'Incidencia') badgeColor = 'bg-red-100 text-red-700';
        if (reg.tipo === 'Felicitación') badgeColor = 'bg-green-100 text-green-700';
        if (reg.tipo === 'Reunión') badgeColor = 'bg-amber-100 text-amber-700';

        container.innerHTML += `
            <div class="p-4 hover:bg-gray-50 transition-colors cursor-pointer flex items-center gap-4 group" 
                 onclick="verDetalleRegistroFamilia('${reg.token}')">
                <div class="flex-shrink-0 w-12 text-center border-r border-gray-100 pr-2">
                    <span class="text-[10px] text-gray-400 font-mono uppercase block">${fecha.split('/')[2]}</span>
                    <span class="text-sm font-bold text-gray-700 block -mt-1">${fecha.split('/')[0]}/${fecha.split('/')[1]}</span>
                </div>
                <div class="flex-grow">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="text-xs font-bold text-accent uppercase tracking-tighter">${reg.estudiante_nombre}</span>
                        <span class="text-[10px] text-gray-400 italic">(${reg.grupo})</span>
                    </div>
                    <h3 class="text-sm font-semibold text-gray-800 leading-tight group-hover:text-accent transition-colors">${reg.tipo}</h3>
                </div>
                <div class="flex-shrink-0 flex items-center gap-3">
                    <div class="flex gap-1">
                        ${reg.tiene_comentario ? 
                            '<span title="Respondido" class="w-2 h-2 rounded-full bg-green-500"></span>' : 
                            '<span title="Pendiente de respuesta" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>'}
                    </div>
                    <svg class="w-5 h-5 text-gray-300 group-hover:text-gray-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

function renderizarOActualizarGrafico(registros) {
    const { labels, series } = procesarDatosGrafico(registros);
    const chartEl = document.querySelector("#chart-element");
    if (!chartEl) return;

    const options = {
        series: series,
        colors: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b'],
        plotOptions: { bar: { borderRadius: 4, columnWidth: '60%' } },
        stroke: { curve: 'smooth', width: state.dashboardChartType === 'line' ? 3 : 0 },
        markers: { size: state.dashboardChartType === 'line' ? 4 : 0, strokeWidth: 2, hover: { size: 6 } },
        xaxis: {
            categories: labels,
            labels: { style: { colors: '#94a3b8', fontSize: '10px', fontWeight: 600 } },
            axisBorder: { show: false },
            axisTicks: { show: false },
            crosshairs: { show: false, width: 0, opacity: 0, stroke: { width: 0, color: 'transparent' }, fill: { type: 'solid', color: 'transparent' } },
            tooltip: { enabled: false }
        },
        yaxis: { labels: { style: { colors: '#94a3b8', fontSize: '10px' } } },
        grid: { borderColor: '#f1f5f9', strokeDashArray: 4, padding: { left: 10, right: 10 } },
        legend: { position: 'top', horizontalAlign: 'right', fontSize: '11px', fontWeight: 700, markers: { radius: 12 } },
        tooltip: { shared: true, intersect: false, theme: 'light', y: { formatter: function(val) { return val + (val === 1 ? " anotación" : " anotaciones") } } },
        states: {
            normal: { filter: { type: 'none', value: 0 } },
            hover: { filter: { type: 'none', value: 0 } },
            active: { allowMultipleDataPointsSelection: false, filter: { type: 'none', value: 0 } }
        },
        chart: {
            type: state.dashboardChartType,
            height: 320,
            stacked: state.dashboardChartType === 'bar',
            toolbar: { show: false },
            zoom: { enabled: false },
            selection: { enabled: false },
            fontFamily: 'inherit',
            animations: { enabled: true },
            events: {
                mounted: function(chart) {
                    if (chart && chart.el) {
                        chart.el.querySelectorAll('title, desc').forEach(el => el.remove());
                    }
                },
                updated: function(chart) {
                    if (chart && chart.el) {
                        chart.el.querySelectorAll('title, desc').forEach(el => el.remove());
                    }
                }
            }
        }
    };

    if (!state.dashboardChart) {
        state.dashboardChart = new ApexCharts(chartEl, options);
        state.dashboardChart.render();
    } else {
        state.dashboardChart.updateOptions({
            chart: { type: state.dashboardChartType, stacked: state.dashboardChartType === 'bar' },
            stroke: { width: state.dashboardChartType === 'line' ? 3 : 0 },
            markers: { size: state.dashboardChartType === 'line' ? 4 : 0 }
        }, false, true); // redrawPaths = true
        state.dashboardChart.updateSeries(series);
    }
}

function procesarDatosGrafico(registros) {
    const tipos = ['General', 'Incidencia', 'Felicitación', 'Reunión'];
    const hoy = new Date();
    const meses = [];
    const labels = [];
    
    // Generar últimos 12 meses
    for (let i = 11; i >= 0; i--) {
        const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
        const mesKey = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
        const mesLabel = d.toLocaleString('es-ES', { month: 'short', year: '2-digit' });
        meses.push(mesKey);
        labels.push(mesLabel);
    }

    const dataMap = {};
    tipos.forEach(t => {
        dataMap[t] = meses.map(() => 0);
    });

    registros.forEach(r => {
        const d = new Date(r.fecha);
        const mesKey = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
        const mesIdx = meses.indexOf(mesKey);
        
        if (mesIdx !== -1 && tipos.includes(r.tipo)) {
            dataMap[r.tipo][mesIdx]++;
        }
    });

    const series = tipos.map(t => ({
        name: t,
        data: dataMap[t]
    }));

    return { labels, series };
}

                    <tbody id="registros-global-lista" class="bg-white divide-y divide-gray-100">
                        <tr>
                            <td colspan="4" class="p-10 text-center text-gray-400 italic">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    `;
    
    state.sortAsc = false;
    cargarRegistrosGlobal();
}

function cargarRegistrosGlobal() {
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.success) {
                state.allRecords = response.data;
                
                // Poblar filtro de grupos
                const grupos = [...new Set(state.allRecords.map(r => r.grupo))].sort();
                const selectGr = document.getElementById('g-filtro-grupo');
                if (selectGr) {
                    // Limpiar excepto el primero
                    selectGr.innerHTML = '<option value="">Todos los grupos</option>';
                    grupos.forEach(g => {
                        if (g) selectGr.innerHTML += `<option value="${g}">${g}</option>`;
                    });
                }

                filtrarYMostrarRegistrosGlobal();
            } else {
                showAlert('Error', 'No se pudieron cargar los registros: ' + (response ? response.error : 'Sin respuesta del servidor'), 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Fallo al comunicar con el servidor: ' + err.message, 'error');
        })
        .listarRegistros();
}

function filtrarYMostrarRegistrosGlobal() {
    const texto = document.getElementById('g-filtro-texto').value.toLowerCase();
    const grupo = document.getElementById('g-filtro-grupo').value;
    const tipo = document.getElementById('g-filtro-tipo').value;
    
    let filtrados = state.allRecords.filter(r => {
        const matchesTexto = r.descripcion.toLowerCase().includes(texto) || 
                             r.estudiante_nombre.toLowerCase().includes(texto) ||
                             r.id_estudiante.toString().toLowerCase().includes(texto);
        const matchesGrupo = !grupo || r.grupo === grupo;
        const matchesTipo = !tipo || r.tipo === tipo;
        return matchesTexto && matchesGrupo && matchesTipo;
    });

    // Ordenar
    filtrados.sort((a, b) => {
        const dA = new Date(a.fecha).getTime();
        const dB = new Date(b.fecha).getTime();
        return state.sortAsc ? dA - dB : dB - dA;
    });

    // Actualizar gráfico si es visible
    const dashContainer = document.getElementById('g-dashboard-container');
    if (dashContainer && !dashContainer.classList.contains('hidden')) {
        renderizarOActualizarGraficoGlobal(filtrados);
    }

    const container = document.getElementById('registros-global-lista');
    if (filtrados.length === 0) {
        container.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-gray-400 italic">No se han encontrado registros.</td></tr>';
        return;
    }

    container.innerHTML = '';
    filtrados.forEach(reg => {
        const fecha = new Date(reg.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        let badgeColor = 'bg-blue-100 text-blue-700';
        if (reg.tipo === 'Incidencia') badgeColor = 'bg-red-100 text-red-700';
        if (reg.tipo === 'Felicitación') badgeColor = 'bg-green-100 text-green-700';
        if (reg.tipo === 'Reunión') badgeColor = 'bg-amber-100 text-amber-700';

        const vistaFam = (reg.vista_p1 || reg.vista_p2) ? 
            '<span class="text-green-600 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path></svg> Visto</span>' : 
            '<span class="text-gray-400 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path></svg> Pendiente</span>';

        const respFam = (reg.comentario_p1 || reg.comentario_p2) ? 
            '<span class="text-accent flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"></path></svg> Respondido</span>' : 
            '';

        container.innerHTML += `
            <tr class="hover:bg-gray-50 transition-colors cursor-pointer" onclick="verDetalleRegistroGlobal('${reg.id}')">
                <td class="px-6 py-4 text-xs text-gray-500 font-mono">${fecha}</td>
                <td class="px-6 py-4">
                    <div class="text-sm font-bold text-gray-900">${reg.estudiante_nombre}</div>
                    <div class="text-[10px] text-gray-400 uppercase font-bold">${reg.grupo}</div>
                </td>
                <td class="px-6 py-4">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${badgeColor}">${reg.tipo}</span>
                </td>
                <td class="px-6 py-4">
                    <div class="flex flex-col gap-1 text-[10px] font-bold uppercase">
                        ${vistaFam}
                        ${respFam}
                    </div>
                </td>
            </tr>
        `;
    });
}

function toggleDashboardGlobal() {
    const container = document.getElementById('g-dashboard-container');
    const label = document.getElementById('g-label-toggle-stats');
    if (container) {
        const isHidden = container.classList.toggle('hidden');
        if (label) label.innerText = isHidden ? 'Ver Estadísticas' : 'Ocultar Estadísticas';
        if (!isHidden) {
            filtrarYMostrarRegistrosGlobal();
            window.scrollTo({ top: container.offsetTop - 20, behavior: 'smooth' });
        }
    }
}

function toggleSortOrderGlobal() {
    state.sortAsc = !state.sortAsc;
    const label = document.getElementById('g-sort-label');
    const icon = document.getElementById('g-sort-icon');
    label.innerText = state.sortAsc ? 'Más antiguos' : 'Más recientes';
    icon.style.transform = state.sortAsc ? 'rotate(180deg)' : 'rotate(0deg)';
    filtrarYMostrarRegistrosGlobal();
}

function limpiarFiltroTextoGlobal() {
    document.getElementById('g-filtro-texto').value = '';
    filtrarYMostrarRegistrosGlobal();
}

function cambiarTipoGraficoGlobal(tipo) {
    state.dashboardChartType = tipo;
    const btnBar = document.getElementById('g-btn-chart-bar');
    const btnLine = document.getElementById('g-btn-chart-line');
    if (tipo === 'bar') {
        btnBar.className = 'px-3 py-1 text-xs font-bold rounded-md transition-all bg-white text-accent shadow-sm';
        btnLine.className = 'px-3 py-1 text-xs font-bold rounded-md transition-all text-gray-500 hover:text-gray-700';
    } else {
        btnLine.className = 'px-3 py-1 text-xs font-bold rounded-md transition-all bg-white text-accent shadow-sm';
        btnBar.className = 'px-3 py-1 text-xs font-bold rounded-md transition-all text-gray-500 hover:text-gray-700';
    }
    filtrarYMostrarRegistrosGlobal();
}

function renderizarOActualizarGraficoGlobal(registros) {
    const { labels, series } = procesarDatosGrafico(registros);
    const chartEl = document.querySelector("#g-chart-element");
    if (!chartEl) return;

    const options = {
        series: series,
        colors: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b'],
        plotOptions: { bar: { borderRadius: 4, columnWidth: '60%' } },
        stroke: { curve: 'smooth', width: state.dashboardChartType === 'line' ? 3 : 0 },
        markers: { size: state.dashboardChartType === 'line' ? 4 : 0, strokeWidth: 2, hover: { size: 6 } },
        xaxis: {
            categories: labels,
            labels: { style: { colors: '#94a3b8', fontSize: '10px', fontWeight: 600 } },
            axisBorder: { show: false },
            axisTicks: { show: false },
            crosshairs: { show: false, width: 0, opacity: 0, stroke: { width: 0, color: 'transparent' }, fill: { type: 'solid', color: 'transparent' } },
            tooltip: { enabled: false }
        },
        yaxis: { labels: { style: { colors: '#94a3b8', fontSize: '10px' } } },
        grid: { borderColor: '#f1f5f9', strokeDashArray: 4, padding: { left: 10, right: 10 } },
        legend: { position: 'top', horizontalAlign: 'right', fontSize: '11px', fontWeight: 700, markers: { radius: 12 } },
        tooltip: { shared: true, intersect: false, theme: 'light', y: { formatter: function(val) { return val + (val === 1 ? " anotación" : " anotaciones") } } },
        states: {
            normal: { filter: { type: 'none', value: 0 } },
            hover: { filter: { type: 'none', value: 0 } },
            active: { allowMultipleDataPointsSelection: false, filter: { type: 'none', value: 0 } }
        },
        chart: {
            type: state.dashboardChartType,
            height: 320,
            stacked: state.dashboardChartType === 'bar',
            toolbar: { show: false },
            zoom: { enabled: false },
            selection: { enabled: false },
            fontFamily: 'inherit',
            animations: { enabled: true },
            events: {
                mounted: function(chart) {
                    if (chart && chart.el) {
                        chart.el.querySelectorAll('title, desc').forEach(el => el.remove());
                    }
                },
                updated: function(chart) {
                    if (chart && chart.el) {
                        chart.el.querySelectorAll('title, desc').forEach(el => el.remove());
                    }
                }
            }
        }
    };

    if (!state.dashboardChartGlobal) {
        state.dashboardChartGlobal = new ApexCharts(chartEl, options);
        state.dashboardChartGlobal.render();
    } else {
        state.dashboardChartGlobal.updateOptions({
            chart: { type: state.dashboardChartType, stacked: state.dashboardChartType === 'bar' },
            stroke: { width: state.dashboardChartType === 'line' ? 3 : 0 },
            markers: { size: state.dashboardChartType === 'line' ? 4 : 0 }
        }, false, true);
        state.dashboardChartGlobal.updateSeries(series);
    }
}

function verDetalleRegistroGlobal(id) {
    toggleLoader(true);
    google.script.run
        .withSuccessHandler(response => {
            toggleLoader(false);
            if (response && response.success) {
                mostrarModalDetalle(response.data);
            } else {
                showAlert('Error', (response ? response.error : 'Sin respuesta'), 'error');
            }
        })
        .withFailureHandler(err => {
            toggleLoader(false);
            showAlert('Error', 'Fallo de conexión: ' + err.message, 'error');
        })
        .obtenerDetalleRegistroStaff(id);
}
